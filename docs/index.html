<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>婦產科次專科每週文獻 | OB/GYN Weekly Literature</title>
<meta name="description" content="每週一自動更新的婦產科各次專科最新期刊論文、綜論與臨床指引（PubMed）。">
<style>
  :root{
    --bg:#faf7f4; --card:#fffdfb; --ink:#3a3633; --muted:#7a726c; --line:#ebe4dd;
    --accent:#94636c; --on-accent:#fff; --accent-soft:#f5ebec;
    --rev:#4f7f84; --rev-soft:#e8f1f1; --gl:#5d8263; --gl-soft:#ebf2ea;
    --art:#756e68; --art-soft:#f1eeea;
    --head-bg:linear-gradient(135deg,#f3e6e4 0%,#eef0e8 100%); --head-ink:#5e4148;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1b1a; --card:#252321; --ink:#e9e4df; --muted:#a59d96; --line:#36322f;
      --accent:#d4a5ad; --on-accent:#2a2224; --accent-soft:#3a2e30;
      --rev:#9cc4c7; --rev-soft:#233132; --gl:#a7c4a9; --gl-soft:#26302a;
      --art:#c2bab3; --art-soft:#2e2b28;
      --head-bg:linear-gradient(135deg,#2e2729 0%,#262c27 100%); --head-ink:#ecd9dc; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--head-bg);color:var(--head-ink);padding:22px 18px 18px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1.45rem;letter-spacing:.02em}
  header p{margin:6px 0 0;opacity:.85;font-size:.92rem}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;margin:20px auto}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  aside{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:14px;max-height:calc(100vh - 24px);overflow:auto}
  @media (max-width:860px){aside{position:static;max-height:none}}
  aside h2{font-size:.95rem;margin:4px 0 8px}
  .btns{display:flex;gap:8px;margin-bottom:8px}
  button{font:inherit;font-size:.85rem;border:1px solid var(--accent);background:var(--card);color:var(--accent);
         padding:5px 12px;border-radius:999px;cursor:pointer}
  button:hover{background:var(--accent-soft)}
  button.primary{background:var(--accent);color:var(--on-accent)}
  label.opt{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.9rem}
  label.opt:hover{background:var(--accent-soft)}
  label.opt input{margin-top:4px;accent-color:var(--accent)}
  label.opt small{display:block;color:var(--muted);font-size:.78rem}
  .cnt{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;border-radius:0;color:var(--ink)}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:12px}
  .status b{color:var(--ink)}
  section.cat{margin-bottom:22px}
  section.cat>h3{font-size:1.05rem;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--accent);display:flex;gap:8px;align-items:baseline}
  section.cat>h3 span{color:var(--muted);font-weight:400;font-size:.85rem}
  article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(80,60,50,.04)}
  article h4{margin:0 0 4px;font-size:1rem;line-height:1.4}
  article h4 a{color:var(--ink);text-decoration:none}
  article h4 a:hover{color:var(--accent);text-decoration:underline}
  .meta{font-size:.83rem;color:var(--muted)}
  .meta i{font-style:normal;color:var(--ink)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--art-soft);color:var(--art)}
  .t-guideline{background:var(--gl-soft);color:var(--gl);font-weight:600}
  .t-review{background:var(--rev-soft);color:var(--rev);font-weight:600}
  .t-article{background:var(--art-soft);color:var(--art);font-weight:600}
  .t-core{background:var(--accent-soft);color:var(--accent)}
  details{margin-top:6px}
  details summary{cursor:pointer;color:var(--accent);font-size:.85rem}
  details p{white-space:pre-line;font-size:.88rem;margin:6px 0 0}
  .links a{font-size:.82rem;color:var(--accent);margin-right:12px}
  .empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px 36px;border-top:1px solid var(--line);margin-top:20px}
  footer .maker{font-size:1rem;color:var(--ink);font-weight:600;letter-spacing:.03em}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>婦產科次專科每週文獻</h1>
    <p>OB/GYN Subspecialty Weekly Literature — 期刊論文 · 綜論 · 臨床指引，每週一自動更新（資料來源：PubMed）</p>
  </div>
</header>

<div class="wrap layout">
  <aside>
    <h2>次專科</h2>
    <div class="btns">
      <button class="primary" id="allOn">全選</button>
      <button id="allOff">全不選</button>
    </div>
    <div id="catList"></div>
    <hr>
    <h2>文章類型</h2>
    <div class="btns">
      <button class="primary" id="typeAllOn">全選</button>
      <button id="typeAllOff">全不選</button>
    </div>
    <div id="typeList"></div>
    <hr>
    <label class="opt"><input type="checkbox" id="coreOnly"><span>只看重點期刊<small>NEJM、Lancet、AJOG、Obstet Gynecol、BJOG、Hum Reprod 等</small></span></label>
    <hr>
    <h2>關鍵字</h2>
    <input type="search" id="q" placeholder="標題、摘要、期刊、作者…">
    <hr>
    <h2>排列方式</h2>
    <div class="seg"><button id="vGroup" class="on">依次專科</button><button id="vDate">依日期</button></div>
  </aside>

  <main>
    <div class="status" id="status">載入中…</div>
    <div id="list"></div>
  </main>
</div>

<footer>
  <div class="maker">製作者：JH CHIU MD · Claude 5.5</div>
  <div>資料每週一自動從 PubMed（NCBI E-utilities）擷取；分類依關鍵字與 MeSH 自動判定，僅供參考，臨床決策請以原文為準。</div>
</footer>

<script>
const TYPES = [
  {id:'guideline', zh:'臨床指引', en:'Guideline'},
  {id:'review',    zh:'綜論 / 系統性回顧', en:'Review'},
  {id:'article',   zh:'期刊論文', en:'Journal article'},
];
const state = { data:null, cats:new Set(), types:new Set(TYPES.map(t=>t.id)), core:false, q:'', view:'group' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){
  fetch('data.json?v=' + Date.now()).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { state.data = d; d.categories.forEach(c => state.cats.add(c.id)); buildControls(); render(); })
    .catch(() => { $('status').textContent = ''; $('list').innerHTML = '<div class="empty">尚無資料：第一次執行的自動更新通常幾分鐘內就會完成，請稍後重新整理。</div>'; });
}

function buildControls(){
  const d = state.data;
  const counts = {};
  d.articles.forEach(a => a.cats.forEach(c => counts[c] = (counts[c]||0) + 1));
  $('catList').innerHTML = d.categories.map(c => `
    <label class="opt"><input type="checkbox" data-cat="${c.id}" checked>
      <span>${esc(c.en)}<small>${esc(c.zh)}</small></span><span class="cnt">${counts[c.id]||0}</span></label>`).join('');
  const tcounts = {};
  d.articles.forEach(a => tcounts[a.type] = (tcounts[a.type]||0) + 1);
  $('typeList').innerHTML = TYPES.map(t => `
    <label class="opt"><input type="checkbox" data-type="${t.id}" checked>
      <span>${t.zh}<small>${t.en}</small></span><span class="cnt">${tcounts[t.id]||0}</span></label>`).join('');

  $('catList').addEventListener('change', e => { const c = e.target.dataset.cat; e.target.checked ? state.cats.add(c) : state.cats.delete(c); render(); });
  $('typeList').addEventListener('change', e => { const t = e.target.dataset.type; e.target.checked ? state.types.add(t) : state.types.delete(t); render(); });
  const setAll = (sel, set, ids, on) => { document.querySelectorAll(sel).forEach(cb => cb.checked = on); set.clear(); if(on) ids.forEach(i => set.add(i)); render(); };
  $('allOn').onclick  = () => setAll('[data-cat]',  state.cats,  d.categories.map(c=>c.id), true);
  $('allOff').onclick = () => setAll('[data-cat]',  state.cats,  [], false);
  $('typeAllOn').onclick  = () => setAll('[data-type]', state.types, TYPES.map(t=>t.id), true);
  $('typeAllOff').onclick = () => setAll('[data-type]', state.types, [], false);
  $('coreOnly').onchange = e => { state.core = e.target.checked; render(); };
  let timer; $('q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 150); };
  $('vGroup').onclick = () => { state.view='group'; $('vGroup').classList.add('on'); $('vDate').classList.remove('on'); render(); };
  $('vDate').onclick  = () => { state.view='date';  $('vDate').classList.add('on');  $('vGroup').classList.remove('on'); render(); };
}

function passes(a){
  if(!state.types.has(a.type)) return false;
  if(state.core && !a.core) return false;
  if(state.q){
    const hay = (a.title+' '+a.abstract+' '+a.journal+' '+a.ta+' '+a.authors).toLowerCase();
    if(!state.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function card(a, showCats){
  const d = state.data, catName = Object.fromEntries(d.categories.map(c => [c.id, c.zh]));
  const tz = TYPES.find(t => t.id === a.type);
  const links = [`<a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">PubMed</a>`];
  if(a.doi) links.push(`<a href="https://doi.org/${encodeURI(a.doi)}" target="_blank" rel="noopener">全文（DOI）</a>`);
  if(a.pmc) links.push(`<a href="https://pmc.ncbi.nlm.nih.gov/articles/${a.pmc}/" target="_blank" rel="noopener">PMC 免費全文</a>`);
  return `<article>
    <h4><a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">${esc(a.title)}</a></h4>
    <div class="meta"><i>${esc(a.ta || a.journal)}</i> · ${esc(a.date)}${a.authors ? ' · ' + esc(a.authors) : ''}</div>
    <div class="tags"><span class="tag t-${a.type}">${tz ? tz.zh : a.type}</span>${a.core ? '<span class="tag t-core">重點期刊</span>' : ''}
      ${showCats ? a.cats.filter(c => state.cats.has(c)).map(c => `<span class="tag">${esc(catName[c])}</span>`).join('') : ''}</div>
    ${a.abstract ? `<details><summary>摘要 Abstract</summary><p>${esc(a.abstract)}</p></details>` : ''}
    <div class="links" style="margin-top:6px">${links.join('')}</div>
  </article>`;
}

function render(){
  const d = state.data; if(!d) return;
  const shown = d.articles.filter(a => a.cats.some(c => state.cats.has(c)) && passes(a));
  const upd = new Date(d.updated).toLocaleString('zh-TW', {timeZone:'Asia/Taipei', hour12:false});
  $('status').innerHTML = `<span>最後更新：<b>${upd}</b>（台北時間）</span><span>收錄範圍：最近 <b>${d.window_days}</b> 天新收錄文獻</span><span>目前顯示 <b>${shown.length}</b> / ${d.articles.length} 篇</span>`;
  if(!shown.length){ $('list').innerHTML = '<div class="empty">沒有符合條件的文獻。請勾選次專科或調整篩選條件。</div>'; return; }
  if(state.view === 'date'){ $('list').innerHTML = shown.map(a => card(a, true)).join(''); return; }
  $('list').innerHTML = d.categories.filter(c => state.cats.has(c.id)).map(c => {
    const items = shown.filter(a => a.cats.includes(c.id));
    if(!items.length) return '';
    return `<section class="cat"><h3>${esc(c.en)} <span>${esc(c.zh)} · ${items.length} 篇</span></h3>${items.map(a => card(a, false)).join('')}</section>`;
  }).join('');
}
load();
</script>
</body>
</html>
