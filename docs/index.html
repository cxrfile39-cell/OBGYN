<title>婦產科次專科每週文獻 | OB/GYN Weekly Literature</title>
<meta name="description" content="每週一自動更新的婦產科各次專科最新期刊論文、綜論與臨床指引（PubMed）。">
<style>
  :root{
    --bg:#faf7f4; --card:#fffdfb; --ink:#3a3633; --muted:#7a726c; --line:#ebe4dd;
    --accent:#94636c; --on-accent:#fff; --accent-soft:#f5ebec;
    --accent2:#5c7c66; --on-accent2:#fff; --accent2-soft:#e8f0e9;
    --rev:#4f7f84; --rev-soft:#e8f1f1; --gl:#5d8263; --gl-soft:#ebf2ea;
    --art:#756e68; --art-soft:#f1eeea;
    --head-bg:linear-gradient(120deg,#f1e0e2 0%,#f6eeee 46%,#edf3ec 54%,#dde9de 100%); --head-ink:#5e4148;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1b1a; --card:#252321; --ink:#e9e4df; --muted:#a59d96; --line:#36322f;
      --accent:#d4a5ad; --on-accent:#2a2224; --accent-soft:#3a2e30;
      --accent2:#a9c7ae; --on-accent2:#1f2a22; --accent2-soft:#26302a;
      --rev:#9cc4c7; --rev-soft:#233132; --gl:#a7c4a9; --gl-soft:#26302a;
      --art:#c2bab3; --art-soft:#2e2b28;
      --head-bg:linear-gradient(120deg,#33282b 0%,#2a2627 46%,#262a26 54%,#24302a 100%); --head-ink:#ecd9dc; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--head-bg);color:var(--head-ink);padding:22px 18px 18px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1.45rem;letter-spacing:.02em}
  header{position:relative;overflow:hidden}
  header .wrap{position:relative;z-index:1}
  .head-art{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:230px;height:165px;color:var(--accent);opacity:.22;pointer-events:none}
  .bg-art{position:fixed;right:-40px;bottom:-30px;width:520px;height:370px;color:var(--accent2);opacity:.07;pointer-events:none;z-index:0}
  .layout,footer{position:relative;z-index:1}
  @media (max-width:860px){.head-art{width:130px;height:94px;right:-18px;top:6px;transform:none;opacity:.2}.bg-art{width:320px;height:228px;opacity:.06}}
  header p{margin:6px 0 0;opacity:.85;font-size:.92rem}
  .upd{display:inline-flex;flex-wrap:wrap;align-items:center;margin-top:12px;padding:6px 14px;border-radius:12px;background:var(--card);
       border:1px solid var(--line);color:var(--ink);font-size:.88rem}
  .upd b{color:var(--accent)} .upd>span:last-child b{color:var(--accent2)} .upd>span{white-space:nowrap} .upd .sep{color:var(--muted);margin:0 8px}
  @media (max-width:560px){.upd{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.upd .sep{display:none}}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;margin:20px auto}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  aside{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:14px;max-height:calc(100vh - 24px);overflow:auto}
  @media (max-width:860px){aside{position:static;max-height:none}}
  aside h2{font-size:.95rem;margin:4px 0 8px}
  .btns{display:flex;gap:8px;margin-bottom:8px}
  button{font:inherit;font-size:.85rem;border:1px solid var(--accent);background:var(--card);color:var(--accent);
         padding:5px 12px;border-radius:999px;cursor:pointer}
  button:hover{background:var(--accent-soft)}
  button.primary{background:var(--accent);color:var(--on-accent)}
  label.opt{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:.9rem}
  label.opt:hover{background:var(--accent-soft)}
  label.opt input{margin-top:4px;accent-color:var(--accent)}
  label.opt small{display:block;color:var(--muted);font-size:.78rem}
  .cnt{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;border-radius:0;color:var(--ink)}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:12px}
  .status b{color:var(--ink)}
  section.cat{margin-bottom:22px}
  section.cat>h3{font-size:1.05rem;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--accent);display:flex;gap:8px;align-items:baseline}
  section.cat>h3 span{color:var(--muted);font-weight:400;font-size:.85rem}
  article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(80,60,50,.04)}
  article h4{margin:0 0 4px;font-size:1rem;line-height:1.4}
  article h4 a{color:var(--ink);text-decoration:none}
  article h4 a:hover{color:var(--accent);text-decoration:underline}
  .meta{font-size:.83rem;color:var(--muted)}
  .meta i{font-style:normal;color:var(--ink)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--art-soft);color:var(--art)}
  .t-guideline{background:var(--gl-soft);color:var(--gl);font-weight:600}
  .t-review{background:var(--rev-soft);color:var(--rev);font-weight:600}
  .t-article{background:var(--art-soft);color:var(--art);font-weight:600}
  .t-core{background:var(--accent-soft);color:var(--accent)}
  details{margin-top:6px}
  details summary{cursor:pointer;color:var(--accent);font-size:.85rem}
  details p{white-space:pre-line;font-size:.88rem;margin:6px 0 0}
  .links a{font-size:.82rem;color:var(--accent);margin-right:12px}
  .empty{padding:40px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px 36px;border-top:1px solid var(--line);margin-top:20px}
  footer .maker{font-size:1rem;color:var(--ink);font-weight:600;letter-spacing:.03em}

  /* ── 雙色：玫瑰（次專科）＋ 鼠尾草綠（文章類型、篩選） ── */
  header{border-bottom:0}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--accent) 0 50%,var(--accent2) 50% 100%)}
  aside h2{display:flex;align-items:center;gap:8px}
  aside h2::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--accent)}

  .g2 button{border-color:var(--accent2);color:var(--accent2)}
  .g2 button:hover{background:var(--accent2-soft)}
  .g2 button.primary,.g2 .seg button.on{background:var(--accent2);color:var(--on-accent2)}
  .g2 .seg button:not(.on){color:var(--ink)}
  .g2 label.opt:hover{background:var(--accent2-soft)}
  .g2 label.opt input{accent-color:var(--accent2)}
  .g2 input[type=search]:focus{outline:2px solid var(--accent2);outline-offset:0;border-color:transparent}
  section.cat:nth-of-type(even)>h3{border-bottom-color:var(--accent2)}

  section.cat:nth-of-type(even) article{border-left-color:var(--accent2)}

  #list>article:nth-of-type(odd){border-left:3px solid var(--accent)}
  .links a+a{color:var(--accent2)}
  footer .maker .m1{color:var(--accent)} footer .maker .m2{color:var(--accent2)}

  /* ── 婦產科元素 ── */
  body{background-image:
    radial-gradient(circle at 24px 24px, transparent 0 5px, color-mix(in srgb, var(--accent) 10%, transparent) 5.5px 6.5px, transparent 7px),
    radial-gradient(circle at 24px 24px, color-mix(in srgb, var(--accent) 8%, transparent) 0 1.6px, transparent 2px),
    radial-gradient(circle at 76px 70px, color-mix(in srgb, var(--accent2) 12%, transparent) 0 2.4px, transparent 3px);
    background-size:104px 104px;background-attachment:fixed}
  header{padding-bottom:40px}
  .ctg{position:absolute;left:0;right:0;bottom:6px;width:100%;height:34px;color:var(--accent);opacity:.32;pointer-events:none}
  h1{display:flex;align-items:center;gap:10px}
  .venus{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent2-soft);display:grid;place-items:center}
  .venus svg{width:22px;height:22px;fill:none;stroke:var(--on-accent);stroke-width:2.2;stroke-linecap:round}
  .ic,.ic-lg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ic{width:20px;height:20px;margin-top:1px;color:var(--accent)}
  label.opt:nth-child(even) .ic{color:var(--accent2)}
  .badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);align-self:center}
  section.cat:nth-of-type(even) .badge{background:var(--accent2-soft);color:var(--accent2)}
  .ic-lg{width:19px;height:19px}
  section.cat>h3{align-items:center}
  .egg{display:block;width:150px;height:38px;margin:0 auto 6px}
  .egg .e1{stroke:var(--accent);stroke-width:1.6;fill:var(--accent-soft)}
  .egg .e2{stroke:var(--accent);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
  .egg .e3{fill:var(--accent);stroke:none;opacity:.5}
  .egg .sp{stroke:var(--accent2);stroke-width:1.4}
  .egg .sp ellipse{fill:var(--accent2)}
  .egg .sp2{opacity:.55}
  @media (prefers-reduced-motion:no-preference){
    .egg .sp{animation:swim 3.2s ease-in-out infinite}
    .egg .sp2{animation-delay:-1.4s}
    @keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  }

  .weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--accent2);border-radius:12px;padding:10px 14px;margin-bottom:12px}
  .weekbar label{font-weight:600}
  .weekbar select{font:inherit;padding:5px 30px 5px 10px;border:1px solid var(--accent2);border-radius:8px;background:var(--bg);color:var(--ink);
    appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--accent2) 50%),linear-gradient(135deg,var(--accent2) 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
  .weekbar .wnav{display:flex;gap:6px}
  .weekbar .wnav button{border-color:var(--accent2);color:var(--accent2);padding:4px 10px}
  .weekbar .wnav button:hover{background:var(--accent2-soft)}
  .weekbar button:disabled{opacity:.35;cursor:default;background:none}
  .weekbar .range{color:var(--muted);font-size:.85rem;flex-basis:100%}
  .weekbar[hidden]{display:none}
  #list{transition:opacity .15s}
</style>
</head>

<script>
const TYPES = [
  {id:'guideline', zh:'臨床指引', en:'Guideline'},
  {id:'review',    zh:'綜論 / 系統性回顧', en:'Review'},
  {id:'article',   zh:'期刊論文', en:'Journal article'},
];
const state = { data:null, cats:new Set(), types:new Set(TYPES.map(t=>t.id)), core:false, q:'', view:'group' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const getJSON = url => fetch(url + '?v=' + Date.now()).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
const fmtD = s => s ? s.replaceAll('-', '/') : '';
const weekLabel = w => `${fmtD(w.week)} 那週（${w.count} 篇）`;
let weeks = [], bound = false;

function load(){
  getJSON('archive/index.json')
    .then(idx => {
      weeks = idx.weeks || [];
      if(!weeks.length) throw new Error('no weeks');
      $('week').innerHTML = weeks.map((w, i) => `<option value="${i}">${i === 0 ? '本週 · ' : ''}${weekLabel(w)}</option>`).join('');
      $('weekbar').hidden = false;
      showUpdate(weeks[0].updated);
      return selectWeek(0);
    })
    .catch(() => getJSON('data.json').then(d => { showUpdate(d.updated); useData(d); }))
    .catch(() => { $('updTime').textContent = '尚未更新'; $('nextTime').textContent = fmtTW(nextMonday()); $('status').textContent = ''; $('list').innerHTML = '<div class="empty">尚無資料：第一次執行的自動更新通常幾分鐘內就會完成，請稍後重新整理。</div>'; });
}


const ICONS = {
  general:  '<circle cx="12" cy="9" r="5"/><path d="M12 14v7M8.5 18h7"/>',
  mfm:      '<circle cx="12" cy="12" r="9"/><circle cx="14" cy="8.6" r="2.6"/><path d="M12.2 10.6C8.6 11.4 8.2 16.8 12 16.8c2.6 0 3.6-2.4 2-3.6"/>',
  rei:      '<circle cx="15" cy="12" r="6"/><circle cx="15" cy="12" r="2"/><ellipse cx="6.2" cy="8" rx="1.5" ry="1.1"/><path d="M4.8 7.6C3.6 6.4 2.6 8 1.6 6.6"/>',
  gynonc:   '<path d="M12 3.5c-2.6 0-3.6 2.8-2.2 5.4L14.8 20.5M12 3.5c2.6 0 3.6 2.8 2.2 5.4L9.2 20.5"/>',
  urogyn:   '<path d="M7 8c0-3.5 10-3.5 10 0 1.6 4.4-1 8-3.5 8.4V20h-3v-3.6C8 16 5.4 12.4 7 8Z"/><path d="M19.5 15.5c0 1-.7 1.6-1.4 1.6s-1.4-.6-1.4-1.6 1.4-2.6 1.4-2.6 1.4 1.6 1.4 2.6Z"/>',
  migs:     '<path d="M3 17c4-5 14-5 18 0"/><path d="M7 4l2.5 10M12 3v10.4M17 4l-2.5 10"/>',
  endoscopy:'<circle cx="16" cy="8" r="3.2"/><path d="M13.7 10.3 4 20M19.5 4.2l1.3-1.3M20.5 8h1.8M16 2.6V1"/>',
  fp:       '<path d="M5 6.5c3.5 2.5 10.5 2.5 14 0M12 8.4V18"/><circle cx="12" cy="19.5" r="1.4"/><path d="M12 21v1.6"/>',
  menopause:'<path d="M14.5 3.5a8.5 8.5 0 1 0 6 12.4A6.6 6.6 0 0 1 14.5 3.5Z"/><path d="M18 3.5v3M16.5 5h3"/>',
  pag:      '<circle cx="12" cy="5.5" r="2.8"/><path d="M12 9.2 6.8 19h10.4Z"/><path d="M10 19v2.6M14 19v2.6"/>',
  obmed:    '<path d="M12 20.5C5.5 16 3 12 5 8.4 6.8 5.4 10 6 12 8.2c2-2.2 5.2-2.8 7 .2 2 3.6-.5 7.6-7 12.1Z"/><path d="M6.5 12.5h3l1.2-2.2 2 4.4 1.2-2.2h3.6"/>',
  fpmrs:    '<path d="M3.5 5.5c0 8 4 12.5 8.5 12.5s8.5-4.5 8.5-12.5"/><path d="M8 7.5c0 4 1.8 6.5 4 6.5s4-2.5 4-6.5"/><path d="M5.5 21h13"/>',
  genetics: '<path d="M8 2.5c0 5 8 5 8 9.5s-8 4.5-8 9.5M16 2.5c0 5-8 5-8 9.5s8 4.5 8 9.5"/><path d="M9 5.5h6M9.6 18.5h4.8M10.5 9h3M10.5 15h3"/>',
  hro:      '<circle cx="9" cy="4" r="2.2"/><path d="M8.4 7.4 8 21M8.4 9.6c6 .6 7.4 7 1 7.6"/><path d="M19 4v5.4"/><circle cx="19" cy="12.4" r=".5"/>',
};
const icon = (id, cls='ic') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]||ICONS.general}</svg>`;
const WD = ['日','一','二','三','四','五','六'];
function fmtTW(dt){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(dt).map(x => [x.type, x.value]));
  const wd = WD[['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)];
  return `${p.year}/${p.month}/${p.day}（${wd}）${p.hour === '24' ? '00' : p.hour}:${p.minute}`;
}
// 下一個週一 06:00 台北時間（= 週日 22:00 UTC）
function nextMonday(){
  const now = new Date(), t = new Date(now);
  t.setUTCHours(22,0,0,0);
  t.setUTCDate(t.getUTCDate() + ((7 - t.getUTCDay()) % 7));
  if(t <= now) t.setUTCDate(t.getUTCDate() + 7);
  return t;
}
function showUpdate(iso){
  const dt = new Date(iso);
  const days = Math.floor((Date.now() - dt) / 86400000);
  $('updTime').textContent = fmtTW(dt) + (days >= 1 ? `（${days} 天前）` : '（今天）');
  $('nextTime').textContent = fmtTW(nextMonday()) + ' 左右';
}

function selectWeek(i){
  i = Math.max(0, Math.min(weeks.length - 1, i));
  $('week').value = i;
  $('prevW').disabled = i >= weeks.length - 1;
  $('nextW').disabled = i <= 0;
  $('list').style.opacity = .4;
  return getJSON(weeks[i].file).then(d => { $('list').style.opacity = 1; useData(d); window.scrollTo({top:0, behavior:'smooth'}); })
    .catch(() => { $('list').style.opacity = 1; $('list').innerHTML = '<div class="empty">這一週的資料讀取失敗，請稍後再試。</div>'; });
}

function useData(d){
  const first = !state.data;
  state.data = d;
  if(first) d.categories.forEach(c => state.cats.add(c.id));
  const r = d.range_start ? `收錄 ${fmtD(d.range_start)} – ${fmtD(d.range_end)} 新進 PubMed 的文獻` : '';
  $('range').textContent = r;
  buildControls();
  render();
}

function buildControls(){
  const d = state.data;
  const counts = {};
  d.articles.forEach(a => a.cats.forEach(c => counts[c] = (counts[c]||0) + 1));
  $('catList').innerHTML = d.categories.map(c => `
    <label class="opt"><input type="checkbox" data-cat="${c.id}" ${state.cats.has(c.id) ? 'checked' : ''}>
      ${icon(c.id)}<span>${esc(c.en)}<small>${esc(c.zh)}</small></span><span class="cnt">${counts[c.id]||0}</span></label>`).join('');
  const tcounts = {};
  d.articles.forEach(a => tcounts[a.type] = (tcounts[a.type]||0) + 1);
  $('typeList').innerHTML = TYPES.map(t => `
    <label class="opt"><input type="checkbox" data-type="${t.id}" ${state.types.has(t.id) ? 'checked' : ''}>
      <span>${t.zh}<small>${t.en}</small></span><span class="cnt">${tcounts[t.id]||0}</span></label>`).join('');

  if(bound) return; bound = true;
  $('week').onchange = e => selectWeek(+e.target.value);
  $('prevW').onclick = () => selectWeek(+$('week').value + 1);
  $('nextW').onclick = () => selectWeek(+$('week').value - 1);
  $('catList').addEventListener('change', e => { const c = e.target.dataset.cat; e.target.checked ? state.cats.add(c) : state.cats.delete(c); render(); });
  $('typeList').addEventListener('change', e => { const t = e.target.dataset.type; e.target.checked ? state.types.add(t) : state.types.delete(t); render(); });
  const setAll = (sel, set, ids, on) => { document.querySelectorAll(sel).forEach(cb => cb.checked = on); set.clear(); if(on) ids.forEach(i => set.add(i)); render(); };
  $('allOn').onclick  = () => setAll('[data-cat]',  state.cats,  state.data.categories.map(c=>c.id), true);
  $('allOff').onclick = () => setAll('[data-cat]',  state.cats,  [], false);
  $('typeAllOn').onclick  = () => setAll('[data-type]', state.types, TYPES.map(t=>t.id), true);
  $('typeAllOff').onclick = () => setAll('[data-type]', state.types, [], false);
  $('coreOnly').onchange = e => { state.core = e.target.checked; render(); };
  let timer; $('q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 150); };
  $('vGroup').onclick = () => { state.view='group'; $('vGroup').classList.add('on'); $('vDate').classList.remove('on'); render(); };
  $('vDate').onclick  = () => { state.view='date';  $('vDate').classList.add('on');  $('vGroup').classList.remove('on'); render(); };
}

function passes(a){
  if(!state.types.has(a.type)) return false;
  if(state.core && !a.core) return false;
  if(state.q){
    const hay = (a.title+' '+a.abstract+' '+a.journal+' '+a.ta+' '+a.authors).toLowerCase();
    if(!state.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function card(a, showCats){
  const d = state.data, catName = Object.fromEntries(d.categories.map(c => [c.id, c.zh]));
  const tz = TYPES.find(t => t.id === a.type);
  const links = [`<a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">PubMed</a>`];
  if(a.doi) links.push(`<a href="https://doi.org/${encodeURI(a.doi)}" target="_blank" rel="noopener">全文（DOI）</a>`);
  if(a.pmc) links.push(`<a href="https://pmc.ncbi.nlm.nih.gov/articles/${a.pmc}/" target="_blank" rel="noopener">PMC 免費全文</a>`);
  return `<article>
    <h4><a href="https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/" target="_blank" rel="noopener">${esc(a.title)}</a></h4>
    <div class="meta"><i>${esc(a.ta || a.journal)}</i> · ${esc(a.date)}${a.authors ? ' · ' + esc(a.authors) : ''}</div>
    <div class="tags"><span class="tag t-${a.type}">${tz ? tz.zh : a.type}</span>${a.core ? '<span class="tag t-core">重點期刊</span>' : ''}
      ${showCats ? a.cats.filter(c => state.cats.has(c)).map(c => `<span class="tag">${esc(catName[c])}</span>`).join('') : ''}</div>
    ${a.abstract ? `<details><summary>摘要 Abstract</summary><p>${esc(a.abstract)}</p></details>` : ''}
    <div class="links" style="margin-top:6px">${links.join('')}</div>
  </article>`;
}

function render(){
  const d = state.data; if(!d) return;
  const shown = d.articles.filter(a => a.cats.some(c => state.cats.has(c)) && passes(a));
  $('status').innerHTML = `${weeks.length ? '' : `<span>收錄範圍：最近 <b>${d.window_days}</b> 天新收錄文獻</span>`}<span>目前顯示 <b>${shown.length}</b> / ${d.articles.length} 篇</span>`;
  if(!shown.length){ $('list').innerHTML = '<div class="empty">沒有符合條件的文獻。請勾選次專科或調整篩選條件。</div>'; return; }
  if(state.view === 'date'){ $('list').innerHTML = shown.map(a => card(a, true)).join(''); return; }
  $('list').innerHTML = d.categories.filter(c => state.cats.has(c.id)).map(c => {
    const items = shown.filter(a => a.cats.includes(c.id));
    if(!items.length) return '';
    return `<section class="cat"><h3><i class="badge">${icon(c.id,'ic-lg')}</i>${esc(c.en)} <span>${esc(c.zh)} · ${items.length} 篇</span></h3>${items.map(a => card(a, false)).join('')}</section>`;
  }).join('');
}
load();
</script>
</body>
</html>
