name: Weekly literature update

on:
  schedule:
    - cron: "0 22 * * 0"   # 每週一 06:00（台北時間）= 週日 22:00 UTC
  push:                    # 第一次上傳檔案時自動執行，不需手動啟動
    branches: [main]
    paths-ignore:
      - "docs/data.json"
      - "docs/archive/**"
      - "docs/journals.json"
      - "docs/range/**"
      - "README.md"
  workflow_dispatch:       # 保留手動執行按鈕（非必要）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest literature from PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch_pubmed.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "Weekly literature update $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
